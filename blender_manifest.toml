schema_version = "1.0.0"

id = "easy_conifer"
version = "0.9.0"
name = "Easy Conifer"
tagline = "Procedural trees and shrubs on Geometry Nodes"
maintainer = "Pavel Fomin <ghostpwl@gmail.com>"
type = "add-on"
website = "https://github.com/GhostPWLk1n/EasyTree"

tags = ["Geometry Nodes", "Add Mesh"]

